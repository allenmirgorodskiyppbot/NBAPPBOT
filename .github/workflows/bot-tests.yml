name: Bot regression tests

on:
  push:
    branches: [main]
    paths:
      - 'chatbot/**'
      - '.github/workflows/bot-tests.yml'
  pull_request:
    paths:
      - 'chatbot/**'
      - '.github/workflows/bot-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: chatbot/requirements.txt
      - name: Install application and OCR test dependencies
        run: |
          python -m pip install -r chatbot/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core
      - name: Test isolated fixtures and mocked services
        run: python chatbot/run_tests.py
