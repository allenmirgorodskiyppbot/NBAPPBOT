name: NBA daily public data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nba-daily-data.yml'
      - 'chatbot/nba_daily_export.py'
  schedule:
    # 23:59 New York is 03:59 or 04:59 UTC. Later runs finish late games
    # and reconcile corrections; scheduled Actions can start after the minute.
    - cron: '59 3,4 * * *'
    - cron: '29,59 5-13 * * *'
permissions:
  contents: write
concurrency:
  group: nba-public-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Collect all teams and preserve prior successful data
        run: python chatbot/nba_daily_export.py --output data/live --days 7
      - name: Publish changed box scores
        run: |
          git add data/live
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'NBAPPBOT data refresh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public NBA daily box scores'
          git pull --rebase origin main
          git push origin HEAD:main
