name: NBA daily public data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nba-daily-data.yml'
      - 'chatbot/nba_daily_export.py'
      - 'chatbot/mirror_sources.py'
      - 'chatbot/advanced_refresh.py'
      - 'chatbot/tracking_publications.py'
      - 'chatbot/historical_matchup_refresh.py'
      - 'chatbot/structured_availability.py'
      - 'chatbot/official_injury_pdf.py'
      - 'chatbot/career_history_refresh.py'
      - 'chatbot/history_backfill.py'
      - 'chatbot/matchup_history_targets.json'
      - 'chatbot/matchup_refresh_scope.json'
  schedule:
    # Previous-day statistics: morning publication and hourly catches through the evening.
    # UTC hours cover 10/11 AM through 10/11 PM Eastern across daylight saving time.
    - cron: '15 0-3,15-23 * * *'
permissions:
  contents: write
concurrency:
  group: nba-public-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Date for verified source cache
        id: source-cache-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore verified historical tracking source bytes
        uses: actions/cache@v4
        with:
          path: data/.nba-tracking-cache
          key: nba-tracking-v1-${{ runner.os }}-${{ steps.source-cache-date.outputs.day }}-${{ hashFiles('chatbot/historical_matchup_refresh.py', 'chatbot/tracking_publications.py') }}
          restore-keys: |
            nba-tracking-v1-${{ runner.os }}-
      - run: python -m pip install httpx==0.28.1 pyarrow==22.0.0 pypdf==6.1.3
      - name: Refresh existing dataset entities and preserve prior successful data
        run: python chatbot/nba_daily_export.py --output data/live --days 7
      - name: Publish changed dataset inputs
        run: |
          git add data/live
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'NBAPPBOT data refresh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh existing NBA dataset inputs'
          git pull --rebase origin main
          git push origin HEAD:main

