name: NBA daily public data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nba-daily-data.yml'
      - 'chatbot/nba_daily_export.py'
      - 'chatbot/mirror_sources.py'
      - 'chatbot/advanced_refresh.py'
  schedule:
    # Previous-day statistics: morning publication, then catch-up retries.
    - cron: '15 15-22 * * *'
permissions:
  contents: write
concurrency:
  group: nba-public-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1 pyarrow==22.0.0
      - name: Refresh existing dataset entities and preserve prior successful data
        run: python chatbot/nba_daily_export.py --output data/live --days 7
      - name: Publish changed dataset inputs
        run: |
          git add data/live
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'NBAPPBOT data refresh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh existing NBA dataset inputs'
          git pull --rebase origin main
          git push origin HEAD:main
