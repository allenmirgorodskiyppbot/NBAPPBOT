name: Build Akash image

on:
  push:
    branches: [codex/akash-ready]
    paths:
      - "nbabot/**"
      - "tests/**"
      - "deploy/akash/**"
      - "scripts/akash-seed.py"
      - "config.example.json"
      - "requirements.lock"
      - "pyproject.toml"
      - ".dockerignore"
      - ".github/workflows/akash-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: akash-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Test application
        run: python -m unittest discover -s tests -v

      - name: Choose registry image
        id: image
        shell: bash
        run: |
          task_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'name=%s\n' "$task_image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish code-only image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/akash/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:akash
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show the pinned image for Akash
        env:
          TASK_IMAGE: ${{ steps.image.outputs.name }}
          TASK_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python - <<'PY'
          import os
          reference = os.environ["TASK_IMAGE"] + "@" + os.environ["TASK_DIGEST"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("## Image ready for Akash\n\n```text\n" + reference + "\n```\n\n")
              output.write("Copy this digest-pinned image into `deploy/akash/deploy-spreadsheet.yaml`.\n\n")
              output.write("Make the code-only GHCR package public before using a provider without registry credentials. The uploaded workbook and database are excluded from this image.\n")
          PY
