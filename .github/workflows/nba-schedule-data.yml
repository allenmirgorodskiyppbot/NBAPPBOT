name: NBA current event timing
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nba-schedule-data.yml'
      - 'chatbot/publish_public_data.py'
      - 'chatbot/game_schedule_check.py'
      - 'chatbot/nba_daily_export.py'
  schedule:
    # An old relay stays ineligible; Actions scheduling does not guarantee freshness.
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
concurrency:
  group: nba-public-data-schedule
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Check current NBA event timing
        run: python chatbot/nba_daily_export.py --output data/live --schedule-only
      - name: Publish source timestamp and validated event response
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python chatbot/publish_public_data.py --mode schedule
