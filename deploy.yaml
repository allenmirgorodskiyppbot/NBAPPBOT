# Free news and previous-day dataset refresh. Preserve credentials and the existing /data volume.
version: '2.0'
services:
  chatbot:
    image: python:3.12.12-slim-bookworm
    command:
    - /bin/sh
    - -c
    args:
    - |
      python -u - <<'PY'
      import os, urllib.request
      ref = os.environ['SOURCE_REF']
      url = 'https://raw.githubusercontent.com/allenmirgorodskiyppbot/NBAPPBOT/' + ref + '/chatbot/bootstrap.py'
      with urllib.request.urlopen(url, timeout=120) as response:
          code = response.read()
      exec(compile(code, 'bootstrap.py', 'exec'), {'__name__': '__main__'})
      PY
    env:
    - NBA_DATA_SOURCE=manual
    - DAILY_NBA_REFRESH=1
    - NEWS_SOURCE=rss
    - SOURCE_REF=4703a5d20efa1e1e1f34e1826400e6da9ae0a65f
    - DATA_DIR=/data
    - TELEGRAM_BOT_TOKEN=
    - TELEGRAM_ALLOWED_USER_ID=
    - FEED_POLL_SECONDS=300
    - FEED_FAST_POLL_SECONDS=60
    - NEWS_FEED_URLS=https://www.rotowire.com/rss/news.php?sport=NBA,https://sny.tv/knicks-feed,https://elitesportsny.com/category/nyc-teams/e-new-york-knicks/feed
    - INJURY_FEED_URL=
    - INSTALL_OCR=1
    - CHAT_PASSWORD=REPLACE_WITH_A_PRIVATE_PASSWORD_16_CHARS_OR_LONGER
    - OLLAMA_URL=http://model:11434
    - OLLAMA_MODEL=qwen3:4b-instruct-2507-q4_K_M
    - MODEL_THREADS=4
    - PYTHONUNBUFFERED=1
    - PIP_DISABLE_PIP_VERSION_CHECK=1
    - FEED_BACKFILL_DAYS=7
    - FEED_CORRECTION_DAYS=3
    - ALERT_TEAMS=NYK
    - NEWS_ALERT_SCOPE=league
    - NEWS_ALERT_MODE=knicks_gameday
    - KNICKS_DIGEST_MINUTES_BEFORE=60
    - KNICKS_SCHEDULE_URL=https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json
    expose:
    - port: 8000
      as: 80
      proto: tcp
      to:
      - global: true
    params:
      storage:
        data:
          mount: /data
          readOnly: false
  model:
    image: ollama/ollama:0.40.13
    env:
    - OLLAMA_HOST=0.0.0.0:11434
    - OLLAMA_NO_CLOUD=1
    - OLLAMA_MAX_LOADED_MODELS=1
    - OLLAMA_NUM_PARALLEL=1
    - OLLAMA_CONTEXT_LENGTH=4096
    - OLLAMA_KEEP_ALIVE=30m
    expose:
    - port: 11434
      proto: tcp
      to:
      - service: chatbot
profiles:
  compute:
    chatbot:
      resources:
        cpu:
          units: 2
        memory:
          size: 3Gi
        storage:
        - size: 4Gi
        - name: data
          size: 20Gi
          attributes:
            persistent: true
            class: beta3
    model:
      resources:
        cpu:
          units: 4
        memory:
          size: 8Gi
        storage:
        - size: 20Gi
  placement:
    akash:
      pricing:
        chatbot:
          denom: uact
          amount: 200
        model:
          denom: uact
          amount: 500
deployment:
  chatbot:
    akash:
      profile: chatbot
      count: 1
  model:
    akash:
      profile: model
      count: 1
