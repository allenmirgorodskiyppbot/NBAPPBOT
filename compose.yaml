services:
  dashboard:
    image: nbappbot:local
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./data:/app/data
      - ./config.local.json:/app/config.local.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  scheduler:
    image: nbappbot:local
    build: .
    restart: unless-stopped
    command: ["python", "-m", "nbabot", "--config", "/app/config.local.json", "scheduler", "run"]
    volumes:
      - ./data:/app/data
      - ./config.local.json:/app/config.local.json:ro
    # Inject provider tokens through your deployment's secure environment manager.
